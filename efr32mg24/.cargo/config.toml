[build]
target = "thumbv8m.main-none-eabihf"
target-dir = "target"

[target.thumbv8m.main-none-eabihf]
# flip-link puts the stack below .data/.bss so an overflow faults rather than
# silently corrupting the heap.
linker = "flip-link"
rustflags = ["-C", "link-arg=-Tlink.x", "--cfg", 'getrandom_backend="custom"']
